name: Demo Manual Workflow

on:
  workflow_dispatch:
    inputs:
      mensaje:
        description: 'Mensaje a imprimir'
        required: true
        default: 'Hola desde GitHub Actions'
        type: string

jobs:
  imprimir-mensaje:
    runs-on: ubuntu-latest
    steps:
      - name: Imprime el mensaje recibido
        run: echo "Mensaje recibido: ${{ inputs.mensaje }}"
